      <div className="pad">
        <div className="g8"/>
        <button className="btn btn-ghost" style={{marginBottom:12}} onClick={()=>setTab('journey')}>{L('myJourney')||'👑 Mein Weg zum Rechenkönig'}</button>
        <div className="sec-lbl">{L('accountSection')||'Konto'}</div>
        <div className="card-sm" style={{padding:'0 16px',marginBottom:12}}>
          {[[L('profileName')||'👤 Name',user?.name],[L('profileClass')||'📚 Klasse',(L('klasseN')||'Klasse {n}').replace('{n}',user?.class||1)],[L('profileTitle')||'🏅 Titel',`${ti.emoji} ${tTitle(appLang,ti)}`]].map(([l,v],i)=>(
            <div key={i} className="info-row"><div className="info-lbl">{l}</div><div className="info-val">{v}</div></div>
          ))}
        </div>
        <div className="sec-lbl">{L('settingsSection')||'Einstellungen'}</div>
        <div className="card-sm" style={{padding:'0 16px',marginBottom:12}}>
          {[[L('sound')||'🔊 Sound',snd,setSnd],[L('vibration')||'📳 Vibration',hapOn,setHap],[L('readAloud')||'🔈 Vorlesen',tts,setTts]].map(([lb,val,setter],i)=>(
            <div key={i} className="info-row">
              <div className="info-lbl">{lb}</div>
              <div className={`toggle${val?' on':''}`} onClick={()=>setter(v=>!v)}><div className="toggle-knob" style={{left:val?24:3}}/></div>
            </div>
          ))}
        </div>
        <div className="sec-lbl">{L('langLabel')||'🌍 Sprache / Language'}</div>
        <div className="card-sm" style={{padding:'12px 16px',marginBottom:12}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            {[['de','🇩🇪 Deutsch'],['fr','🇫🇷 Français'],['en','🇬🇧 English'],['tr','🇹🇷 Türkçe']].map(([code,label])=>(
              <button key={code}
                onClick={()=>setAppLang(code)}
                style={{
                  padding:'12px 8px',borderRadius:'var(--r-lg)',border:`2.5px solid ${appLang===code?'var(--crown)':'var(--border)'}`,
                  background:appLang===code?'var(--crown-lt)':'var(--surface)',
                  fontWeight:800,fontSize:13,cursor:'pointer',color:appLang===code?'var(--crown-dk)':'var(--txt)',
                  transition:'all .15s'
                }}>
                {label}
              </button>
            ))}
          </div>
        </div>
        <button className="btn btn-outline" style={{color:'var(--err)',borderColor:'var(--err)'}} onClick={onLogout}>{L('logout')||'🚪 Ausloggen'}</button>
      </div>
    </div>
  );
}

/* ── AVATAR SCREEN ── */
function AvatarScreen({onBack,user,onSave,appLang='de'}){
  const L=key=>t(appLang,key);
  const [av,setAv]=useState({...DEFAULT_AV,...(user?.av||{})});
  return(
    <div className="screen">
      <div className="hdr"><button className="hdr-back" onClick={onBack}>←</button><div className="hdr-title">🎨 {L('editAvatar')||'Avatar anpassen'}</div></div>
      <div className="pad">
        <div className="g8"/>
        <AvatarBuilder av={av} onChange={setAv} isAbo={user?.abo||false} appLang={appLang}/>
        <div className="g16"/>
        <button className="btn btn-crown" onClick={()=>onSave({...av})}>{L('btnSave')||'💾 Speichern'}</button>
        <button className="btn btn-ghost" style={{marginTop:10}} onClick={onBack}>{L('btnCancel')||'Abbrechen'}</button>
      </div>
    </div>
  );
}

/* ── APP ROOT ── */
function App(){
  const [screen,setScreen]=useState('start');
  const [tab,setTab]=useState('dashboard');
  const [snd,setSnd]=useState(()=>ls('wk_snd',true));
  const [hapOn,setHap]=useState(()=>ls('wk_hap',true));
  const [tts,setTts]=useState(()=>ls('wk_tts',false));
  const [appLang,setAppLang]=useState(()=>ls('wk_lang','de'));
  const [user,setUser]=useState(()=>ls('wk21_user',null));
  const [lvlUp,setLvlUp]=useState(null);
  const [stats,setStats]=useState(()=>ls('wk21_stats',{todayRounds:0,totalRounds:0}));
  // kompStats: {rechnen:{today:{rounds,correct,answered}, week:{...}, all:{...}}, ...}
  const [kompStats,setKompStats]=useState(()=>ls('wk21_kompstats',{}));

  useEffect(()=>{
    if(user){setScreen(ls('wk21_ob',true)?'onboard':'main');}
    else setScreen('start');
  },[]);
  useEffect(()=>{ss('wk21_user',user);},[user]);
  useEffect(()=>{ss('wk21_stats',stats);},[stats]);
  useEffect(()=>{ss('wk21_kompstats',kompStats);},[kompStats]);
  useEffect(()=>{ss('wk_snd',snd);},[snd]);
  useEffect(()=>{ss('wk_hap',hapOn);},[hapOn]);
  useEffect(()=>{ss('wk_tts',tts);},[tts]);
  useEffect(()=>{ss('wk_lang',appLang);_appLang=appLang;},[appLang]);

  // Reset today counters on new day
  useEffect(()=>{
    if(!user)return;
    const today=todayKey(),last=ls('wk21_last','');
    if(last!==today){
      ss('wk21_last',today);
      setStats(s=>({...s,todayRounds:0}));
      // reset today in kompStats
      setKompStats(ks=>{
        const nks={...ks};
        Object.keys(nks).forEach(k=>{nks[k]={...nks[k],today:{rounds:0,correct:0,answered:0}};});
        return nks;
      });
    }
  },[user]);

  function onRegister(fd){
    const u={name:fd.name,class:fd.class||1,av:fd.av||{...DEFAULT_AV},crowns:0,createdAt:new Date().toISOString()};
    setUser(u);ss('wk21_user',u);setScreen('onboard');
  }
  function onLogin(){const u=ls('wk21_user',null);if(u){setUser(u);setScreen('main');}else setScreen('register');}
  function onLogout(){setUser(null);setScreen('start');setTab('dashboard');}

  // onEarn: crownsEarned (0 or 1), correctCount, kompId, schwierigkeit
  function onEarn(crownsEarned,correctCount,kompId,schw){
    if(snd&&crownsEarned>0)playSound('crown');
    // update user crowns
    const oldT=getTitle(user?.crowns||0);
    setUser(u=>{
      if(!u)return u;
      const nc=(u.crowns||0)+crownsEarned;
      const nu={...u,crowns:nc};
      ss('wk21_user',nu);
      const newT=getTitle(nc);
      if(newT.title!==oldT.title)setLvlUp({newT});
      return nu;
    });
    // update global stats
    setStats(s=>({...s,todayRounds:(s.todayRounds||0)+1,totalRounds:(s.totalRounds||0)+1}));
    // update kompStats
    setKompStats(ks=>{
      const prev=ks[kompId]||{today:{rounds:0,correct:0,answered:0},week:{rounds:0,correct:0,answered:0},all:{rounds:0,correct:0,answered:0}};
      const merge=(d)=>({
        rounds:(d.rounds||0)+1,
        correct:(d.correct||0)+correctCount,
        answered:(d.answered||0)+10,
      });
      return{...ks,[kompId]:{
        today:merge(prev.today||{}),
        week:merge(prev.week||{}),
        all:merge(prev.all||{}),
      }};
    });
  }

  function onSaveAvatar(av){
    setUser(u=>{if(!u)return u;const nu={...u,av};ss('wk21_user',nu);return nu;});
    setTab('profile');
  }

  const NAV=[
    {id:'dashboard',ic:'🏠',lb:t(appLang,'home')},
    {id:'aufgaben', ic:'⚡',lb:t(appLang,'tasks')},
    {id:'karten',   ic:'🃏',lb:t(appLang,'cards')},
    {id:'ranking',  ic:'🏆',lb:t(appLang,'top')},
    {id:'profile',  ic:'👤',lb:t(appLang,'profile')},
  ];

  function renderContent(){
    const back=()=>setTab('dashboard');
    switch(tab){
      case 'aufgaben':     return <AufgabenScreen     onBack={back} user={user} snd={snd} hapOn={hapOn} tts={tts} appLang={appLang} onEarn={onEarn}/>;
      case 'downloads':    return <DownloadsScreen     onBack={back} user={user} setTab={setTab} appLang={appLang}/>;
      case 'certificates': return <CertificatesScreen onBack={back} user={user} appLang={appLang}/>;
      case 'ranking':      return <RankingScreen       onBack={back} user={user} setTab={setTab} appLang={appLang}/>;
      case 'journey':      return <JourneyScreen       onBack={back} user={user} appLang={appLang}/>;
      case 'avatar':       return <AvatarScreen        onBack={()=>setTab('profile')} user={user} onSave={onSaveAvatar} appLang={appLang}/>;
      case 'translator':   return <TranslatorScreen    onBack={back} appLang={appLang}/>;
      case 'karten':       return <KartenScreen        onBack={back} user={user} appLang={appLang}/>;
      case 'abo':          return <AboScreen           onBack={back} user={user} appLang={appLang} onUpgrade={()=>{setUser(u=>{const nu={...u,abo:true};ss('wk21_user',nu);return nu;});setTab('dashboard');}}/>;
      case 'parent':       return <ParentScreen        onBack={back} user={user} kompStats={kompStats} setTab={setTab} appLang={appLang}/>;
      case 'profile':      return <ProfileScreen       user={user} onLogout={onLogout} snd={snd} setSnd={setSnd} hapOn={hapOn} setHap={setHap} tts={tts} setTts={setTts} appLang={appLang} setAppLang={setAppLang} onEditAvatar={()=>setTab('avatar')} setTab={setTab}/>;
      default:             return <DashboardScreen     user={user} setTab={setTab} stats={stats} appLang={appLang}/>;
    }
  }

  if(screen==='start')    return <div id="wk"><StartScreen onRegister={()=>setScreen('register')} onLogin={onLogin} appLang={appLang}/></div>;
  if(screen==='register') return <div id="wk"><RegisterScreen onBack={()=>setScreen('start')} onDone={onRegister} appLang={appLang}/></div>;
  if(screen==='onboard')  return <div id="wk"><OnboardingScreen onDone={()=>{ss('wk21_ob',false);setScreen('main');}} userName={user?.name} appLang={appLang}/></div>;

  return(
    <div id="wk" style={{height:'100%',display:'flex',flexDirection:'column'}}>
      {lvlUp&&<LevelUpScreen newT={lvlUp.newT} onDone={()=>setLvlUp(null)} appLang={appLang}/>}
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>{renderContent()}</div>
      <nav className="nav">
        {NAV.map(item=>(
          <button key={item.id} className={`nav-btn${tab===item.id?' on':''}`} onClick={()=>setTab(item.id)}>
            <span className="nav-ic">{item.ic}</span>
            <span>{item.lb}</span>
            {tab===item.id&&<div className="nav-dot"/>}
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
<div id="root" style="height:100%"></div>
